<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prüfung erstellen</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><div class="logo">🚒 Prüfungsassistent</div><nav><a href="admin.html">← Ausbilderbereich</a></nav></header><main class="admin-page"><div class="admin-container"><span class="badge">📝 NEUE PRÜFUNG</span><h1>Prüfung erstellen</h1><p>Wähle Thema und Einstellungen. Aus deinem Material werden überprüfbare Fragenentwürfe erstellt.</p><div id="status"></div><form id="createForm" class="panel"><label for="type">Prüfungsthema</label><select id="type"><option>Feuerwehr-Grundausbildung</option><option>Funk</option><option>Atemschutz</option><option>Technische Hilfeleistung</option><option>Eigene Prüfung</option></select><label for="material">Unterrichtsmaterial</label><textarea id="material" placeholder="Hier Unterrichtsmaterial einfügen …" required></textarea><div class="form-grid"><div><label for="title">Prüfungstitel</label><input id="title" placeholder="z. B. Grundlagen Feuerwehr" required></div><div><label for="count">Fragenentwürfe</label><input id="count" type="number" min="1" max="100" value="10"></div><div><label for="difficulty">Schwierigkeit</label><select id="difficulty"><option>Leicht</option><option selected>Mittel</option><option>Schwer</option></select></div><div><label for="passPercent">Bestehensgrenze (%)</label><input id="passPercent" type="number" min="1" max="100" value="70"></div><div><label for="duration">Zeitlimit (Minuten)</label><input id="duration" type="number" min="1" max="300" value="30"></div></div><div class="actions"><button id="generate" type="button" class="button">Fragenentwürfe erstellen</button><button type="submit" class="button primary">Prüfung speichern</button></div><div id="questions"></div></form></div></main><script src="js/app.js"></script></body></html>

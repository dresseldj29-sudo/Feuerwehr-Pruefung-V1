<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prüfung erstellen</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        🚒 Prüfungsassistent
    </div>

    <nav>
        <a href="admin.html">← Admin</a>
    </nav>

</header>


<main class="admin-page">

<div class="admin-container">

<div class="badge">
    🤖 SCHRITT <span id="stepNumber">1</span> / 5
</div>


<!-- SCHRITT 1 -->

<section id="step1" class="wizard-step">

    <h1>Prüfung auswählen</h1>

    <p>
        Welche Prüfung möchtest du erstellen?
    </p>

    <div class="choice-grid">

        <button onclick="selectType('Feuerwehr-Grundausbildung')">
            🚒 Feuerwehr-Grundausbildung
        </button>

        <button onclick="selectType('Funk')">
            📻 Funk
        </button>

        <button onclick="selectType('Atemschutz')">
            😷 Atemschutz
        </button>

        <button onclick="selectType('Technische Hilfeleistung')">
            🛠️ Technische Hilfeleistung
        </button>

        <button onclick="selectType('Eigene Prüfung')">
            ✏️ Eigene Prüfung
        </button>

    </div>

</section>


<!-- SCHRITT 2 -->

<section
    id="step2"
    class="wizard-step"
    style="display:none"
>

    <h1>📚 Unterrichtsmaterial</h1>

    <p>
        Füge hier dein Unterrichtsmaterial ein.
    </p>

    <textarea
        id="material"
        placeholder="Hier dein Unterrichtsmaterial einfügen..."
    ></textarea>

    <button
        class="button primary"
        onclick="nextStep(3)"
    >
        Weiter →
    </button>

</section>


<!-- SCHRITT 3 -->

<section
    id="step3"
    class="wizard-step"
    style="display:none"
>

    <h1>📝 Prüfung einstellen</h1>

    <label>
        Titel
    </label>

    <input
        id="titel"
        placeholder="z. B. Atemschutz Grundlagen"
    >


    <label>
        Anzahl Fragen
    </label>

    <input
        id="anzahl"
        type="number"
        value="20"
        min="1"
        max="100"
    >


    <label>
        Schwierigkeit
    </label>

    <select id="schwierigkeit">

        <option>Leicht</option>
        <option selected>Mittel</option>
        <option>Schwer</option>

    </select>


    <label>
        Bestehensgrenze
    </label>

    <input
        id="grenze"
        type="number"
        value="70"
        min="1"
        max="100"
    >


    <button
        class="button primary"
        onclick="nextStep(4)"
    >
        Weiter →
    </button>

</section>


<!-- SCHRITT 4 -->

<section
    id="step4"
    class="wizard-step"
    style="display:none"
>

    <h1>🤖 Prüfung erstellen</h1>

    <p>
        Die KI erstellt jetzt die Fragen aus deinem
        Unterrichtsmaterial.
    </p>

    <button
        class="button primary"
        onclick="createExam()"
    >
        🤖 Prüfung erstellen
    </button>

    <div id="aiStatus"></div>

</section>


<!-- SCHRITT 5 -->

<section
    id="step5"
    class="wizard-step"
    style="display:none"
>

    <h1>✅ Prüfung fertig</h1>

    <div id="result"></div>

</section>


</div>

</main>


<script src="js/erstellen.js"></script>

</body>
</html>

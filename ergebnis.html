<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prüfungsergebnis</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        🚒 Prüfungsergebnis
    </div>

</header>


<main class="admin-page">

<div class="admin-container">

    <div class="badge">
        📊 ERGEBNIS
    </div>

    <h1>
        Prüfung abgeschlossen
    </h1>


    <div
        id="result"
        class="feature"
    >
        Ergebnis wird geladen...
    </div>

</div>

</main>


<script>

const API_URL =
    localStorage.getItem("API_URL") || "";


const params =
    new URLSearchParams(
        window.location.search
    );


const id =
    params.get("id");


async function loadResult() {

    if (!API_URL) {

        document
            .getElementById("result")
            .innerHTML =
            "Backend nicht verbunden.";

        return;

    }


    try {

        const response =
            await fetch(
                API_URL +
                "/api/teilnehmer/" +
                encodeURIComponent(id)
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Fehler"
            );

        }


        document
            .getElementById("result")
            .innerHTML = `

                <h2>

                    ${escapeHTML(
                        data.vorname
                    )}

                    ${escapeHTML(
                        data.nachname
                    )}

                </h2>


                <p>

                    Feuerwehr:

                    ${escapeHTML(
                        data.feuerwehr
                    )}

                </p>


                <div class="result-big">

                    ${data.prozent} %

                </div>


                <p>

                    ${data.punkte}
                    /
                    ${data.maxPunkte}
                    Punkte

                </p>


                <br>


                <h2
                    class="${
                        data.bestanden
                            ? "success"
                            : "danger"
                    }"
                >

                    ${
                        data.bestanden
                            ? "🟢 BESTANDEN"
                            : "🔴 NICHT BESTANDEN"
                    }

                </h2>

            `;


    } catch (error) {

        document
            .getElementById("result")
            .innerHTML = `

                <h2>
                    ❌ Fehler
                </h2>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

            `;

    }

}


function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


loadResult();

</script>

</body>
</html>

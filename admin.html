<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ausbilder – Feuerwehr Prüfung</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><div class="logo">🚒 Ausbilderbereich</div><nav><a href="index.html">Startseite</a></nav></header><main class="admin-page"><div class="admin-container wide"><section id="loginForm" class="panel"><span class="badge">🔐 AUSbilder LOGIN</span><h1>Willkommen zurück</h1><p>Bitte melde dich mit deinem Ausbilder-Zugang an.</p><form id="loginFormInner"><label for="username">Benutzername</label><input id="username" autocomplete="username" required><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button class="button primary" type="submit">Anmelden</button><a class="button" href="index.html">Zurück</a></div></form></section><div id="status" aria-live="polite"></div><section id="adminBereich" class="hidden"><div class="admin-header"><div><span class="badge">AUSBILDER DASHBOARD</span><h1>Prüfungen verwalten</h1></div><div class="actions"><a class="button primary" href="erstellen.html">＋ Prüfung erstellen</a><button id="refresh" class="button">Aktualisieren</button><button id="logout" class="button">Abmelden</button></div></div><div id="examList" class="list">Lade Prüfungen …</div></section></div></main><script src="js/app.js"></script><script>document.querySelector("#loginForm").addEventListener("submit",e=>{e.preventDefault();document.querySelector("#loginFormInner").dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}))})</script></body></html>

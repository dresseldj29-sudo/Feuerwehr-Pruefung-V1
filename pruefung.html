<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prüfung teilnehmen</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><div class="logo">🚒 Feuerwehr Prüfung</div><nav><a href="index.html">Startseite</a></nav></header><main class="admin-page"><div class="admin-container"><div id="status"></div><form id="participantForm" class="panel"><span class="badge">👨‍🚒 TEILNEHMER</span><h1>Prüfung starten</h1><p>Trage deine Daten und den Prüfungscode ein.</p><div class="form-grid"><div><label for="firstName">Vorname</label><input id="firstName" required></div><div><label for="lastName">Nachname</label><input id="lastName" required></div></div><label for="department">Feuerwehr</label><input id="department" placeholder="z. B. Feuerwehr Musterstadt" required><label for="code">Prüfungscode</label><input id="code" placeholder="ABC123" required><div class="actions"><a class="button" href="index.html">Zurück</a><button class="button primary" type="submit">Prüfung starten →</button></div></form><section id="examStage" class="panel hidden"><span class="badge">PRÜFUNG LÄUFT</span><div class="actions" style="justify-content:space-between"><h1 id="questionNumber"></h1><strong id="timer" class="badge">⏱ 00:00</strong></div><div class="progress"><div id="progressBar" class="progress-bar"></div></div><div id="questionBox" class="question-card"></div><div class="actions"><button id="prev" class="button" type="button">← Zurück</button><button id="next" class="button primary" type="button">Weiter →</button></div></section></div></main><script src="js/app.js"></script></body></html>

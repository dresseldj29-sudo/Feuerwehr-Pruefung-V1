<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Feuerwehr Prüfung</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        🚒 Feuerwehr Prüfung
    </div>

</header>


<main class="admin-page">

<div class="admin-container">


<!-- TEILNEHMER -->

<div id="teilnehmer">

    <div class="badge">
        👨‍🚒 TEILNEHMER
    </div>


    <h1>
        Prüfung starten
    </h1>


    <p>
        Bitte gib deine Daten ein.
    </p>


    <label>
        Vorname
    </label>

    <input
        id="vorname"
        placeholder="Vorname"
    >


    <label>
        Nachname
    </label>

    <input
        id="nachname"
        placeholder="Nachname"
    >


    <label>
        Feuerwehr
    </label>

    <input
        id="feuerwehr"
        placeholder="z. B. Feuerwehr Musterstadt"
    >


    <br><br>


    <button
        class="button primary"
        onclick="startExam()"
    >
        Prüfung starten →
    </button>

</div>


<!-- PRÜFUNG -->

<div
    id="exam"
    style="display:none"
>

    <div class="badge">

        Frage
        <span id="questionNumber">
            1
        </span>

        /

        <span id="questionTotal">
            0
        </span>

    </div>


    <div class="progress">

        <div
            id="progressBar"
            class="progress-bar"
        ></div>

    </div>


    <div
        id="timer"
        class="warning"
        style="
            font-size:22px;
            font-weight:bold;
            margin:20px 0;
        "
    >
        ⏱ 00:00
    </div>


    <div class="exam-question">

        <div
            id="question"
        ></div>

    </div>


    <div class="exam-navigation">

        <button
            class="button secondary"
            onclick="previousQuestion()"
        >
            ← Zurück
        </button>


        <button
            id="nextButton"
            class="button primary"
            onclick="nextQuestion()"
        >
            Weiter →
        </button>

    </div>

</div>


</div>

</main>


<script src="js/pruefung.js"></script>

</body>
</html>
